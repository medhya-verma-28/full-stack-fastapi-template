name: Specmatic CI

on:
  push:
    branches:
      - master
      - specmatic_integration
  pull_request:
    branches:
      - master
      - specmatic_integration

jobs:
  specmatic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and Start Stack with Override
        run: |
          docker compose -f compose.yml -f compose.override.yml up -d db backend

      - name: Wait for Backend Readiness
        run: |
          docker compose exec -T backend bash -c "while ! curl -s http://localhost:8000/api/v1/utils/health-check/; do sleep 1; done"

      - name: Generate and Update Token Step
        run: |
          # Added PyJWT to the dependency layer installer inside the isolated root environment worker
          docker run --rm --network=host -v ${{ github.workspace }}:/workspace -w /workspace python:3.10-slim bash -c "
            pip install requests PyJWT && 
            python specmatic-auth.py
          "
          
          # Read the generated token file from the workspace root and apply log masking
          TOKEN_VALUE=$(cat ./specmatic_token.txt)
          echo "::add-mask::$TOKEN_VALUE"
          echo "SPECMATIC_TOKEN=$TOKEN_VALUE" >> $GITHUB_ENV

      - name: Update GitHub Secret Programmatically
        uses: gliech/create-github-secret-action@v1
        with:
          name: SPECMATIC_AUTH_TOKEN
          value: ${{ env.SPECMATIC_TOKEN }}
          token: ${{ secrets.SPECMATIC_AUTH_TOKEN_WRITE_PERMISSION }}

      - name: Run Specmatic Contract Tests via Pytest
        run: |
          # Inject the token dynamically and trigger pytest on the backend service
          docker compose exec -T -e SPECMATIC_AUTH_TOKEN="${{ env.SPECMATIC_TOKEN }}" backend pytest

      - name: Extract Specmatic Reports from Container
        if: always()
        run: |
          mkdir -p ./specmatic-reports
          docker compose cp backend:/app/build/reports/specmatic-tests/ ./specmatic-reports/ || true

      - name: Upload Specmatic Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-contract-test-reports
          path: ./specmatic-reports/
          retention-days: 5

      - name: Stop and Clean Stack
        if: always()
        run: |
          docker compose -f compose.yml -f compose.override.yml down -v
