name: Specmatic CI

on:
  push:
    branches:
      - master
      - specmatic_integration
  pull_request:
    branches:
      - master
      - specmatic_integration

jobs:
  specmatic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and Start Stack with Override
        run: |
          docker compose -f compose.yml -f compose.override.yml up -d db backend

      - name: Wait for Backend Readiness
        run: |
          docker compose exec -T backend bash -c "while ! curl -s http://localhost:8000/health-check/; do sleep 1; done"

      - name: Run Specmatic Contract Tests
        run: |
          docker compose exec -T backend python specmatic-auth.py

      - name: Extract Specmatic Reports from Container
        if: always()
        run: |
          mkdir -p ./specmatic-reports
          docker compose cp backend:/app/build/reports/specmatic-tests/ ./specmatic-reports/ || true

      - name: Upload Specmatic Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-contract-test-reports
          path: ./specmatic-reports/
          retention-days: 5

      - name: Stop and Clean Stack
        if: always()
        run: |
          docker compose -f compose.yml -f compose.override.yml down -v
        
        echo "Contract Test Runner Exit Code: $CONTRACT_EXIT"
        echo "Resiliency Test Runner Exit Code: $RESILIENCY_EXIT"
        
        if [ "$CONTRACT_EXIT" -ne 0 ] || [ "$RESILIENCY_EXIT" -ne 0 ]; then
          echo "Specmatic tests failed!"
          exit 1
        fi
        echo "All Specmatic contract and resiliency tests passed successfully!"

    # 5. Dump real-time container logs only if a failure occurs anywhere in the pipeline
    - name: Print Specmatic Tests Container Logs
      if: always()
      run: |
        echo "=== PostgreSQL Database Logs ==="
        docker compose logs db-1 || true
        echo "=== FastAPI Backend Application Logs ==="
        docker compose logs backend-1 || true
        echo "=== Contract Test Logs ==="
        docker compose logs specmatic-contract-runner-1 || true
        echo "=== Resiliency Test Logs ==="
        docker compose logs specmatic-resiliency-runner-1 || true

    # 6. Archive and save HTML reports to your GitHub Dashboard
    - name: Upload Test Report Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: specmatic-test-reports
        path: build/reports/  

    # 7. Tear down the environment completely, wiping any volumes generated during testing
    - name: Teardown environment
      if: always()
      run: docker compose down -v
