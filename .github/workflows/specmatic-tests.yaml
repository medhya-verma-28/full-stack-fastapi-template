name: Specmatic CI

on:
  push:
    branches:
      - master
      - specmatic_integration
  pull_request:
    branches:
      - master
      - specmatic_integration

jobs:
  specmatic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build and Start Stack with Override
        run: |
          # Corrected file extensions to match full-stack-fastapi-template defaults (.yaml)
          docker compose -f compose.yml -f compose.override.yml up -d db backend

      - name: Wait for Backend Readiness
        run: |
          docker compose exec -T backend bash -c "while ! curl -s http://localhost:8000/api/v1/utils/health-check/; do sleep 1; done"

      - name: Generate and Update Token Step
        run: |
          # Dynamically execute your root-level auth script and isolate the token output string cleanly
          TOKEN_VALUE=$(docker run --rm --network=host -v ${{ github.workspace }}:/workspace -w /workspace python:3.10-slim bash -c "
            pip install -q requests PyJWT && 
            python specmatic-auth.py
          " | tail -n 1 | tr -d '\r\n')
          
          echo "::add-mask::$TOKEN_VALUE"
          echo "SPECMATIC_TOKEN=$TOKEN_VALUE" >> $GITHUB_ENV

      - name: Update GitHub Secret Programmatically
        uses: gliech/create-github-secret-action@v1
        with:
          name: SPECMATIC_AUTH_TOKEN
          value: ${{ env.SPECMATIC_TOKEN }}
          pa_token: ${{ secrets.SPECMATIC_AUTH_TOKEN_WRITE_PERMISSION }}

      - name: Run Specmatic Contract Tests via Docker Compose
        run: |
          # Executes your contract test target inside your existing compose runtime definition layer
          SPECMATIC_AUTH_TOKEN="${{ env.SPECMATIC_TOKEN }}" docker compose -f compose.yml -f compose.override.yml run --rm specmatic-contract-runner

      - name: Run Specmatic Resiliency Tests via Docker Compose
        run: |
          # Executes your fuzzed resiliency test target inside your existing compose runtime definition layer
          SPECMATIC_AUTH_TOKEN="${{ env.SPECMATIC_TOKEN }}" docker compose -f compose.yml -f compose.override.yml run --rm specmatic-resiliency-runner

      - name: Extract Specmatic Reports from Container
        if: always()
        run: |
          # Using sudo forces execution past potential root-user container file lock constraints safely
          sudo mkdir -p ./specmatic-test-reports
          sudo cp -r ./build/reports/ ./specmatic-test-reports/ || true

      - name: Upload Specmatic Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-test-reports
          path: ./specmatic-test-reports/
          retention-days: 5

      - name: Stop and Clean Stack
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.override.yaml down -v
