name: Specmatic CI

on:
  push:
    branches:
      - master
      - specmatic_integration
  pull_request:
    branches:
      - master
      - specmatic_integration

jobs:
  specmatic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and Start Stack with Override
        run: |
          docker compose -f compose.yml -f compose.override.yml up -d db backend

      - name: Wait for Backend Readiness
        run: |
          docker compose exec -T backend bash -c "while ! curl -s http://localhost:8000/api/v1/utils/health-check/; do sleep 1; done"

      - name: Run Specmatic Contract Tests
        run: |
          docker compose exec -T backend python specmatic-auth.py

      - name: Extract Generated Token from Container
        run: |
          # Pull the generated token file out of the isolated container
          docker compose cp backend:/app/specmatic_token.txt ./specmatic_token.txt || true
          
          # Read it to an environment variable, then immediately mask it to avoid log leaks
          TOKEN_VALUE=$(cat ./specmatic_token.txt)
          echo "::add-mask::$TOKEN_VALUE"
          echo "SPECMATIC_TOKEN=$TOKEN_VALUE" >> $GITHUB_ENV

      - name: Update GitHub Secret Programmatically
        uses: gliech/create-github-secret-action@v1
        with:
          name: 'SPECMATIC_AUTH_TOKEN'
          value: ${{ env.SPECMATIC_TOKEN }}
          repository: ${{ github.repository }}
          # Requires a custom PAT stored in your repository secrets with write:secrets scope
          token: ${{ secrets.SPECMATIC_CI_PAT }}

      - name: Extract Specmatic Reports from Container
        if: always()
        run: |
          mkdir -p ./specmatic-reports
          docker compose cp backend:/app/build/reports/specmatic-tests/ ./specmatic-reports/ || true

      - name: Upload Specmatic Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-contract-test-reports
          path: ./specmatic-reports/
          retention-days: 5

      - name: Stop and Clean Stack
        if: always()
        run: |
          docker compose -f compose.yml -f compose.override.yml down -v

