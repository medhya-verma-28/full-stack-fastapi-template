services:

  # Local services are available on their ports, but also available on:
  # http://api.localhost.tiangolo.com: backend
  # http://dashboard.localhost.tiangolo.com: frontend
  # etc. To enable it, update .env, set:
  # DOMAIN=localhost.tiangolo.com
  proxy:
    image: traefik:3.6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "80:80"
      - "8090:8080"
    # Duplicate the command from compose.yml to add --api.insecure=true
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Add a constraint to only use services with the label for this stack
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Enable debug logging for local development
      - --log.level=DEBUG
      # Enable the Dashboard and API
      - --api
      # Enable the Dashboard and API in insecure mode for local development
      - --api.insecure=true
    labels:
      # Enable Traefik for this service, to make it available in the public network
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # Dummy https-redirect middleware that doesn't really redirect, only to
      # allow running it locally
      - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
    networks:
      - traefik-public
      - default

  db:
    restart: "no"
    ports:
      - "5432:5432"

  adminer:
    restart: "no"
    ports:
      - "8080:8080"

  backend:
    restart: "no"
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - fastapi
      - run
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
    environment:
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/openapi.json')"]
      interval: 3s
      timeout: 2s
      retries: 10


  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  frontend:
    restart: "no"
    ports:
      - "5173:80"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
        - NODE_ENV=development

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323

  # Specmatic contract test runner for the backend OpenAPI contract.
  specmatic-contract-runner:
    image: specmatic/specmatic:2.50.0
    volumes:
      - .:/usr/src/app
      - ./specmatic_contract.yaml:/usr/src/app/specmatic.yaml:ro
    working_dir: /usr/src/app
    command: >
      test
      --config=specmatic.yaml
      --testBaseURL=http://backend:8000
      --filter="!(PATH='/api/v1/password-recovery/{email}' && STATUS >= '400') && !(PATH='/api/v1/utils/health-check/' && STATUS = '400') && !(PATH = '/api/v1/private/users/' && (STATUS = '200' || STATUS = '400'))"
    environment:
      - OAuth2PasswordBearer=${SPECMATIC_AUTH_TOKEN}
    depends_on:
      backend:
        condition: service_healthy

  # Specmatic generative resiliency runner for contract edge cases.
  specmatic-resiliency-runner:
    image: specmatic/specmatic:2.50.0
    volumes:
      - .:/usr/src/app
      - ./specmatic_resiliency.yaml:/usr/src/app/specmatic.yaml:ro
    working_dir: /usr/src/app
    command: >
      test
      --config=specmatic.yaml
      --testBaseURL=http://backend:8000
      --filter="!(PATH='/api/v1/password-recovery/{email}' && STATUS >= '400') && !(PATH='/api/v1/utils/health-check/' && STATUS = '400') && !(PATH = '/api/v1/private/users/' && (STATUS = '200' || STATUS = '400'))"
    environment:
      - OAuth2PasswordBearer=${SPECMATIC_AUTH_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
      specmatic-contract-runner:
        condition: service_completed_successfully

networks:
  traefik-public:
    external: false
  specmatic-tests:
    driver: bridge
