version: 3

systemUnderTest:
  service:
    $ref: "#/components/services/fastapi-backend-service"
    runOptions:
      $ref: "#/components/runOptions/localFastApiExecution"

components:
  sources:
    localFilesystemRepo:
      filesystem:
        directory: "."

  services:
    fastapi-backend-service:
      description: "FastAPI backend service validated from the OpenAPI contract."
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/localFilesystemRepo"
            specs:
              - spec:
                  id: FastApiSpec
                  path: "backend/contracts/openapi.json"
  runOptions:
    localFastApiExecution:
      openapi:
        type: "test"
        baseUrl: "http://backend:8000"

specmatic:
  settings:
    test:
      timeoutInMilliseconds: 20000
      schemaResiliencyTests: all
    mock:
      generative: true
  governance:
    report:
      formats:
        - html
      outputDirectory: "backend/build/reports/specmatic-tests"
  